[advisories]
version = 2
# All advisories without an explicit ignore entry are denied by default in v2.
# Add RUSTSEC IDs here only to suppress known false-positives.
ignore = [
    "RUSTSEC-2026-0009", # CVSS 4.0 advisory; cargo-deny parser does not support CVSS 4.0
    "RUSTSEC-2024-0436", # paste crate unmaintained; transitive dep from Leptos, macro-only
    # h2 0.3.x "unbounded empty DATA frames": the fix exists only in h2 0.4, which
    # requires the axum 0.7 / tonic 0.12 / opentelemetry 0.27 migration.  h2 0.3 is
    # reached through hyper 0.14 + tonic 0.11 (OTLP export *client*); the runner
    # itself serves HTTP/1.1 (axum's http2 feature is off), so the server-side DoS
    # vector does not apply.  Revisit when the OpenTelemetry stack is upgraded.
    "RUSTSEC-2026-0258",
    # proc-macro-error2 unmaintained: compile-time only, transitive from
    # leptos_macro / leptos_router_macro / reactive_stores_macro (SPA crate).
    "RUSTSEC-2026-0173",
    # ttf-parser unmaintained: transitive from pdf-extract -> lopdf 0.42 (font
    # parsing while extracting text from PDFs inside the workspace); no maintained
    # alternative in the pdf-extract line yet.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
]
# Any license not in the allow list above is denied.
# Copyleft licenses (GPL, LGPL, AGPL, MPL, etc.) are therefore blocked.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
