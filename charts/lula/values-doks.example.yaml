# DOKS deployment values — DigitalOcean Kubernetes (EXAMPLE, safe to commit)
#
# 1. Copy this file to charts/lula/values-doks.local.yaml (gitignored) and fill in
#    the secrets, OR keep secrets out of files entirely:
#      helm upgrade --install lula charts/lula -n lula-orch #        -f charts/lula/values-doks.example.yaml #        --set secrets.remoteApiBearerToken="$(openssl rand -hex 32)" #        --set secrets.runnerApiKey="$(openssl rand -hex 24)" #        --set secrets.hmacSecret="$(openssl rand -hex 32)" #        --set secrets.digitalOceanModelAccessKey="$DIGITAL_OCEAN_MODEL_ACCESS_KEY"
#    OR let the External Secrets Operator manage the lula-secrets Secret
#    (infra/k8s/external-secrets/) and leave the secrets block empty.
# 2. Never commit a values file with real secrets. CI runs gitleaks on every push
#    and pull request (.github/workflows/secret-scan.yml); the pre-commit hook in
#    .pre-commit-config.yaml catches them locally.
image:
  repository: registry.digitalocean.com/lula-orch/lula
  pullPolicy: Always
  tag: "v1.2.3"

imagePullSecrets:
  - name: registry-lula-orch

orchestrator:
  replicaCount: 1  # Start with 1 to save cost, HPA scales up
  profile: "prod"
  routerModel: "alibaba-qwen3-32b"
  plannerModel: "alibaba-qwen3-32b"
  coderModel: "alibaba-qwen3-32b"
  reporterModel: "alibaba-qwen3-32b"
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 80

runner:
  replicaCount: 1
  gvisor:
    enabled: true  # gVisor pool with sandbox=gvisor label + taint
  workspace:
    persistent: false
    storageClass: "do-block-storage"
    size: "10Gi"
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  service:
    type: ClusterIP
    port: 8088

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: lula.eiv.eng.br
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: lula-tls
      hosts:
        - lula.eiv.eng.br

secrets:
  remoteApiBearerToken: "CHANGE_ME_bearer_token_32+_random_chars"
  runnerApiKey: "CHANGE_ME_runner_api_key"
  digitalOceanModelAccessKey: "CHANGE_ME_do_model_access_key"
  checkpointRedisUrl: ""
  checkpointPostgresDsn: ""
  hmacSecret: "CHANGE_ME_hmac_secret_32+_random_chars"
