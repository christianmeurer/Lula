name: Secret Scan

# Fails any push or pull request that introduces a credential anywhere in the
# repository history reachable from the ref being built.  Rules and allowlists
# live in .gitleaks.toml; developers get the same check locally through the
# pre-commit hook in .pre-commit-config.yaml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write # lets the action comment on the offending PR

jobs:
  gitleaks:
    name: "gitleaks (full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not just the tip commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE is only required for organization-owned repositories.
